<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BCS Nature Campus Club Finder · 2026/27</title>
<meta name="description" content="Filterable directory of Berlin Cosmopolitan School Nature Campus clubs, 2026/27." />
<style>
  html, body { margin: 0; padding: 0; background: #EFEBE2; }
  #root { min-height: 100vh; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js" crossorigin></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

/* ---------------------------------------------------------------
   BCS Nature Campus Clubs 2026/27 — filterable directory
   Built from the Club Plan (Week A/B grid) and the Club Programme
   (descriptions). No times were given in the school's documents.
----------------------------------------------------------------*/

const C = {
  paper: "#EFEBE2",
  card: "#FFFFFF",
  ink: "#221D14",
  soft: "#6E6455",
  line: "#D6CFC1",
  moss: "#5B7233",
  bark: "#8A5A2B",
};

const CAT_COLOR = {
  "Arts & making": "#B4622C",
  "Music & performance": "#7A4E86",
  Movement: "#2F7D6A",
  Languages: "#2B6FA0",
  STEM: "#3D6B33",
  "Games & strategy": "#8A6A2F",
  "Nature skills": "#5B7233",
  Wellbeing: "#A0506B",
};

// day, week, name, category, grade note, description
const CLUBS = [
  // ---- MONDAY ----
  ["Mon", "AB", "Art Cafe", "Arts & making", null, "Children enjoy a relaxed creative space where they can freely experiment with different artistic ideas and materials."],
  ["Mon", "AB", "Civilization III · Dirty Learning", "Nature skills", 5, "Building on the previous levels, children apply advanced wilderness skills independently and take greater responsibility within the group."],
  ["Mon", "AB", "Circus I", "Movement", null, "Children discover foundational circus skills through playful movement, balance, coordination and creative performance."],
  ["Mon", "AB", "Movie Making · Student-led", "Arts & making", null, "Children plan, film and edit their own short films while sharing creative and technical roles within the group."],
  ["Mon", "AB", "Robotics", "STEM", null, "Children build and programme robots while developing logical thinking, creativity and collaborative problem-solving."],
  ["Mon", "AB", "Beginning Sculpture", "Arts & making", null, "Children explore shape, texture and three-dimensional design while creating sculptures with different materials."],
  ["Mon", "AB", "Cooking 101", "Arts & making", null, "Children learn simple cooking techniques, prepare food together and practise safe, responsible work in the kitchen."],
  ["Mon", "A", "Flag Football", "Movement", null, "Children learn the rules and techniques of flag football while practising teamwork, agility and fair play."],
  ["Mon", "B", "Chess", "Games & strategy", null, "Children learn and practise chess strategies while strengthening concentration, planning and respectful competition."],

  // ---- TUESDAY ----
  ["Tue", "AB", "Beyblades · Student-led", "Games & strategy", null, "Children test spinning-top strategies, design fair challenges and organise friendly matches together."],
  ["Tue", "AB", "Civilization II · Dirty Learning", "Nature skills", "3-4", "Building on earlier experiences, children deepen their wilderness skills through increasingly independent challenges in nature."],
  ["Tue", "AB", "Sound Bath", "Wellbeing", null, "Children experience guided relaxation through sound, explore different instruments and are invited to share their own musical skills with the group."],
  ["Tue", "AB", "Turkish II", "Languages", null, "Children build on their Turkish language skills through conversation, stories, games and cultural exploration."],
  ["Tue", "AB", "Amazing Machines", "STEM", null, "Children explore how machines and robots work and use their creativity to design, build and test their own constructions."],
  ["Tue", "AB", "Drawing, Painting and Photography", "Arts & making", null, "Children explore different ways of seeing and expressing ideas through drawing, painting and photography."],
  ["Tue", "A", "Dance and Movement", "Movement", null, "Children explore rhythm, expression and coordination through playful dance and creative movement."],
  ["Tue", "B", "Sign Language", "Languages", null, "Children learn introductory signs and discover how visual language can support communication and inclusion."],

  // ---- WEDNESDAY ----
  ["Wed", "AB", "Musical Project", "Music & performance", null, "Children combine acting, singing and dancing as they work together to develop and perform a musical."],
  ["Wed", "AB", "Forest Parkour", "Movement", null, "Children move creatively and safely through natural surroundings while developing balance, strength and confidence."],
  ["Wed", "AB", "Sound Bath", "Wellbeing", null, "Children experience guided relaxation through sound, explore different instruments and are invited to share their own musical skills with the group."],
  ["Wed", "AB", "Beginning Fabric Arts", "Arts & making", null, "Children learn introductory textile techniques and create simple projects with fabric, thread and other fibres."],
  ["Wed", "A", "Card Games", "Games & strategy", null, "Children learn and play a variety of card games while practising strategy, patience and fair play."],
  ["Wed", "B", "Songwriting", "Music & performance", null, "Children create lyrics and melodies and develop their own songs individually and together."],
  ["Wed", "B", "Karaoke Club", "Music & performance", null, "Children choose and sing songs together while developing confidence, musical expression and joy in performing."],

  // ---- THURSDAY ----
  ["Thu", "AB", "Spanish", "Languages", null, "Children discover Spanish through songs, games, stories and playful everyday conversation."],
  ["Thu", "AB", "Civilization I · Dirty Learning", "Nature skills", 1, "Children begin developing practical wilderness skills and learn to explore nature safely, attentively and respectfully."],
  ["Thu", "AB", "Circus II", "Movement", null, "Children build on existing circus skills and develop more confident movement, coordination and performance ideas."],
  ["Thu", "AB", "Pokemon Club · Student-led", "Games & strategy", null, "Children share their interest in Pokemon through games, collecting, creative activities and fair group play."],
  ["Thu", "AB", "Turkish I", "Languages", null, "Children begin exploring Turkish through songs, games, stories and useful everyday language."],
  ["Thu", "AB", "Advanced Fabric Arts", "Arts & making", null, "Children extend their textile skills through more detailed projects using fabric, thread and creative techniques."],
  ["Thu", "AB", "Chess", "Games & strategy", null, "Children learn and practise chess strategies while strengthening concentration, planning and respectful competition."],
  ["Thu", "A", "Art Cafe", "Arts & making", null, "Children enjoy a relaxed creative space where they can freely experiment with different artistic ideas and materials."],
  ["Thu", "B", "Storytime in English", "Languages", null, "Children enjoy English stories, talk about characters and ideas and develop language through imagination and play."],

  // ---- FRIDAY ----
  ["Fri", "AB", "Bowling", "Movement", null, "Children visit a bowling centre, develop their bowling skills and enjoy an active group experience together.", "Off-site venue"],
  ["Fri", "AB", "Civilization II · Dirty Learning", "Nature skills", "3-4", "Building on earlier experiences, children deepen their wilderness skills through increasingly independent challenges in nature."],
  ["Fri", "AB", "Fashion Design", "Arts & making", null, "Children develop fashion ideas through sketching, colour, materials and their own creative designs."],
  ["Fri", "AB", "Chess", "Games & strategy", null, "Children learn and practise chess strategies while strengthening concentration, planning and respectful competition."],

  // ---- INTEREST CHECK ----
  ["TBC", "AB", "Sound Bath", "Wellbeing", null, "Children experience guided relaxation through sound, explore different instruments and are invited to share their own musical skills with the group.", "Interest check"],
  ["TBC", "AB", "Amazing Machines", "STEM", null, "Children explore how machines and robots work and use their creativity to design, build and test their own constructions.", "Interest check"],
  ["TBC", "AB", "Gymnastics", "Movement", null, "Children develop strength, flexibility, balance and coordination through age-appropriate gymnastic activities.", "Interest check"],
].map((r, i) => ({
  id: i, day: r[0], week: r[1], name: r[2], cat: r[3], grade: r[4], desc: r[5], note: r[6] || null,
}));

const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "TBC"];
const DAY_FULL = { Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", TBC: "Day to be confirmed" };
const CATS = ["Arts & making", "Music & performance", "Movement", "Languages", "STEM", "Games & strategy", "Nature skills", "Wellbeing"];

// Civilization levels are the only grade-restricted clubs in the school's documents
const gradeOK = (c, g) => {
  if (g === "All" || c.grade === null) return true;
  if (c.grade === "3-4") return g === 3 || g === 4;
  return c.grade === g;
};

function NatureClubFinder() {
  const [grade, setGrade] = useState("All");
  const [week, setWeek] = useState("All");
  const [day, setDay] = useState("All");
  const [cat, setCat] = useState("All");
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(null);

  const base = useMemo(() => CLUBS.filter((c) => gradeOK(c, grade)), [grade]);

  const rows = useMemo(() => {
    const t = q.trim().toLowerCase();
    return base
      .filter((c) => week === "All" || c.week === "AB" || c.week === week)
      .filter((c) => day === "All" || c.day === day)
      .filter((c) => cat === "All" || c.cat === cat)
      .filter((c) => !t || c.name.toLowerCase().includes(t) || c.desc.toLowerCase().includes(t))
      .sort((a, b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || a.name.localeCompare(b.name));
  }, [base, week, day, cat, q]);

  const grouped = DAYS.map((d) => ({ day: d, items: rows.filter((r) => r.day === d) })).filter((g) => g.items.length);
  const countFor = (d) => base.filter((c) => (week === "All" || c.week === "AB" || c.week === week) && c.day === d).length;
  const filtersOn = day !== "All" || cat !== "All" || q !== "" || week !== "All";
  const reset = () => { setDay("All"); setCat("All"); setQ(""); setWeek("All"); };

  const chip = (active, color) => ({
    padding: "5px 11px", borderRadius: 999, fontSize: 13,
    fontWeight: active ? 700 : 500, cursor: "pointer",
    border: `1px solid ${active ? (color || C.ink) : C.line}`,
    background: active ? (color || C.ink) : "transparent",
    color: active ? "#fff" : C.soft, fontFamily: "inherit",
    whiteSpace: "nowrap", transition: "all .15s ease",
  });
  const label = { fontSize: 10.5, letterSpacing: ".14em", textTransform: "uppercase", color: C.soft, fontWeight: 700, marginBottom: 7 };

  const weekTag = (w) => {
    if (w === "AB") return { text: "Every week", bg: "#EDEFE6", fg: C.moss };
    if (w === "A") return { text: "Week A", bg: "#F3E9DC", fg: C.bark };
    return { text: "Week B", bg: "#E7EBF2", fg: "#3E5C86" };
  };

  return (
    <div style={{ background: C.paper, color: C.ink, minHeight: "100%", fontFamily: "'Karla', ui-sans-serif, system-ui, sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
        * { box-sizing: border-box; }
        .disp { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
        .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
        .row:hover { background: #FAF7F1; }
        button:focus-visible { outline: 2px solid ${C.moss}; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
      `}</style>

      <div style={{ maxWidth: 1040, margin: "0 auto", padding: "28px 18px 60px" }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
          <span className="mono" style={{ fontSize: 11, letterSpacing: ".18em", color: C.moss, fontWeight: 600 }}>BCS · NATURE CAMPUS</span>
          <span className="mono" style={{ fontSize: 11, letterSpacing: ".18em", color: C.soft }}>2026/27</span>
        </div>
        <h1 className="disp" style={{ fontSize: "clamp(30px,6vw,50px)", lineHeight: 1.02, margin: "8px 0 6px", fontWeight: 800, letterSpacing: "-.02em" }}>
          Club finder
        </h1>
        <p style={{ margin: "0 0 22px", color: C.soft, fontSize: 15, maxWidth: 580 }}>
          Explore · Create · Move · Connect. Every club from the plan and the programme, in one filterable list.
        </p>

        {/* Week toggle — the structural choice that matters most here */}
        <div style={{ marginBottom: 18 }}>
          <div style={label}>Which week</div>
          <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
            {[["All", "Show everything"], ["A", "Week A"], ["B", "Week B"]].map(([v, t]) => (
              <button key={v} onClick={() => setWeek(v)} style={{ ...chip(week === v, C.moss), padding: "8px 14px", fontSize: 14 }}>{t}</button>
            ))}
          </div>
          <p style={{ margin: "8px 0 0", fontSize: 12.5, color: C.soft }}>
            Clubs tagged <em>Every week</em> run in both weeks. Week A and Week B clubs alternate on the school's two-week timetable.
          </p>
        </div>

        {/* Day strip */}
        <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, padding: "13px 14px", marginBottom: 18 }}>
          <div style={{ ...label, marginBottom: 10 }}>Choose a day</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 6 }}>
            {DAYS.map((d) => {
              const n = countFor(d);
              const sel = day === d;
              return (
                <button key={d} disabled={!n} onClick={() => setDay(sel ? "All" : d)}
                  style={{
                    padding: "9px 4px", borderRadius: 9, cursor: n ? "pointer" : "default",
                    border: sel ? `2px solid ${C.ink}` : `1px solid ${C.line}`,
                    background: sel ? C.moss : n ? "#F5F6F0" : "#F2F0EB",
                    color: sel ? "#fff" : n ? C.ink : "#B5AEA1", fontFamily: "inherit", transition: "all .15s ease",
                  }}>
                  <span style={{ display: "block", fontSize: 13, fontWeight: 700 }}>{d}</span>
                  <span className="mono" style={{ fontSize: 11, opacity: .75 }}>{n}</span>
                </button>
              );
            })}
          </div>
        </div>

        {/* Filters */}
        <div style={{ display: "flex", flexWrap: "wrap", gap: 18, marginBottom: 14 }}>
          <div style={{ flex: "1 1 230px" }}>
            <div style={label}>Search</div>
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="e.g. chess, fabric, forest"
              style={{ width: "100%", padding: "9px 12px", borderRadius: 9, border: `1px solid ${C.line}`, background: C.card, fontSize: 14, color: C.ink, fontFamily: "inherit" }} />
          </div>
          <div style={{ flex: "2 1 340px" }}>
            <div style={label}>Type of club</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              <button onClick={() => setCat("All")} style={chip(cat === "All")}>All</button>
              {CATS.map((k) => (
                <button key={k} onClick={() => setCat(cat === k ? "All" : k)} style={chip(cat === k, CAT_COLOR[k])}>{k}</button>
              ))}
            </div>
          </div>
        </div>

        {/* Grade */}
        <div style={{ marginBottom: 16 }}>
          <div style={label}>Grade <span style={{ textTransform: "none", letterSpacing: 0, fontWeight: 500 }}>— affects the Civilization levels only</span></div>
          <div style={{ display: "flex", gap: 7, flexWrap: "wrap" }}>
            {["All", 1, 2, 3, 4, 5, 6].map((g) => (
              <button key={g} onClick={() => setGrade(g)} style={{ ...chip(grade === g, C.bark), padding: "7px 13px", fontSize: 14 }}>{g}</button>
            ))}
          </div>
          {(grade === 1 || grade === 2) && (
            <p style={{ margin: "9px 0 0", fontSize: 13, color: C.bark, fontWeight: 600 }}>
              Grade {grade}: maximum {grade === 1 ? "one club" : "two clubs"} per week, to protect free play, outdoor exploration and rest.
            </p>
          )}
        </div>

        {/* Result bar */}
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10, flexWrap: "wrap" }}>
          <span className="mono" style={{ fontSize: 12, color: C.soft }}>
            {rows.length} club{rows.length === 1 ? "" : "s"}
            {week !== "All" && ` · week ${week}`}
            {day !== "All" && ` · ${DAY_FULL[day]}`}
          </span>
          {filtersOn && <button onClick={reset} style={{ ...chip(false), fontSize: 12, padding: "3px 10px" }}>Clear filters</button>}
        </div>

        {/* Table */}
        <div style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 14, overflow: "hidden" }}>
          {grouped.length === 0 && (
            <div style={{ padding: "38px 20px", textAlign: "center" }}>
              <p className="disp" style={{ margin: 0, fontSize: 18, fontWeight: 700 }}>No clubs match these filters.</p>
              <button onClick={reset} style={{ ...chip(true, C.moss), padding: "8px 16px", fontSize: 14, marginTop: 12 }}>Clear filters</button>
            </div>
          )}
          {grouped.map((g) => (
            <div key={g.day}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 8, padding: "10px 16px", background: "#F4F2EC", borderTop: `1px solid ${C.line}`, borderBottom: `1px solid ${C.line}` }}>
                <span className="disp" style={{ fontSize: 15, fontWeight: 800, letterSpacing: "-.01em" }}>{DAY_FULL[g.day]}</span>
                <span className="mono" style={{ fontSize: 11, color: C.soft }}>{g.items.length}</span>
              </div>
              {g.items.map((c) => {
                const isOpen = open === c.id;
                const wt = weekTag(c.week);
                return (
                  <div key={c.id} className="row" style={{ borderBottom: "1px solid #EDE9E1", transition: "background .15s" }}>
                    <button onClick={() => setOpen(isOpen ? null : c.id)}
                      style={{ width: "100%", display: "grid", gridTemplateColumns: "1fr auto", gap: 12, alignItems: "center", padding: "11px 16px", background: "none", border: "none", textAlign: "left", cursor: "pointer", fontFamily: "inherit", color: C.ink }}>
                      <span style={{ minWidth: 0 }}>
                        <span style={{ fontWeight: 700, fontSize: 15 }}>{c.name}</span>
                        <span style={{ display: "block", fontSize: 12, color: CAT_COLOR[c.cat], fontWeight: 600, marginTop: 2 }}>
                          {c.cat}
                          {c.grade && <span style={{ color: C.soft, fontWeight: 500 }}> · Grade {c.grade}</span>}
                          {c.note && <span style={{ color: C.soft, fontWeight: 500 }}> · {c.note}</span>}
                        </span>
                      </span>
                      <span className="mono" style={{ fontSize: 11, borderRadius: 6, padding: "3px 8px", whiteSpace: "nowrap", background: wt.bg, color: wt.fg, fontWeight: 600 }}>{wt.text}</span>
                    </button>
                    {isOpen && <p style={{ margin: 0, padding: "0 16px 14px", fontSize: 14, color: C.soft, lineHeight: 1.5 }}>{c.desc}</p>}
                  </div>
                );
              })}
            </div>
          ))}
        </div>

        <div style={{ marginTop: 22, fontSize: 13, color: C.soft, lineHeight: 1.6 }}>
          <p style={{ margin: "0 0 8px" }}>
            <strong style={{ color: C.ink }}>Good to know:</strong> no club times were included in the school's registration documents — the Club teacher will confirm these. Families select a first and second choice for each relevant day. Grade 1 may take one club per week and Grade 2 up to two.
          </p>
          <p style={{ margin: 0 }}>
            Sound Bath, Amazing Machines and Gymnastics are listed as an interest check with the day still to be confirmed. Apart from the Civilization levels, the documents do not specify grade ranges for individual clubs.
          </p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NatureClubFinder />);
</script>
</body>
</html>
